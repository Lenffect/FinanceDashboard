<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lennar Finance</title>
<style>
:root{--bg:#fff;--side:#f7f7f5;--card:#fff;--tx:#37352f;--mut:#787774;--line:#e9e9e7;--hover:rgba(55,53,47,.06);--acc:#0f7b6c;--accbg:#ddedea;--warn:#cb912f;--warnbg:#fbf3db;--bad:#e03e3e;--badbg:#fbe4e4;--blue:#2383e2;--bluebg:#e7f3f8;--shadow:none}
@media (prefers-color-scheme:dark){:root{--bg:#191919;--side:#202020;--card:#252525;--tx:#e6e6e4;--mut:#9b9a97;--line:#2f2f2f;--hover:rgba(255,255,255,.07);--acc:#4dab9a;--accbg:#1b3a35;--warn:#ffdc49;--warnbg:#3a3320;--bad:#ff7369;--badbg:#42201f;--blue:#529cca;--bluebg:#1f3340;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:flex;min-height:100vh}
aside{width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;padding:6px 8px 14px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font:700 12px/1 inherit;font-style:normal}
nav{display:flex;flex-direction:column;gap:1px}
nav h6{margin:16px 8px 4px;font:600 11px/1 inherit;color:var(--mut);letter-spacing:.3px;text-transform:uppercase}
nav button{background:none;border:0;color:var(--tx);padding:6px 8px;border-radius:6px;font:inherit;cursor:pointer;text-align:left;display:flex;justify-content:space-between;align-items:center}
nav button:hover{background:var(--hover)}nav button.on{background:var(--hover);font-weight:600}
main{flex:1;min-width:0;max-width:1120px;margin:0 auto;padding:34px 40px 100px}
h1{font-size:26px;font-weight:700;letter-spacing:-.4px;margin:0}h2{font-size:15px;font-weight:600;margin:28px 0 10px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.bar .sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.k{color:var(--mut);font-size:12px}.big{font-size:22px;font-weight:700;letter-spacing:-.3px}
.row{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
button.b,a.b{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:6px 12px;font:500 13px inherit;cursor:pointer;text-decoration:none;display:inline-block}
button.b.sec,a.b.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}button.b.sec:hover{background:var(--hover)}
button.b.red{background:var(--bad);color:#fff}button.lnk{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;padding:0}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 9px;width:100%}
input[type=checkbox]{width:auto}input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
.bar input,.bar select{width:auto}
table{width:100%;border-collapse:collapse;background:transparent}
th{font-size:12px;font-weight:500;color:var(--mut);text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tbody tr.klik{cursor:pointer}tbody tr.klik:hover td{background:var(--hover)}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.mut{color:var(--mut)}.sm{font-size:12px}
.pos{color:var(--acc)}.neg{color:var(--bad)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--bg);color:var(--mut);white-space:nowrap}
.tag.ik{background:var(--accbg);color:var(--acc)}.tag.gedeeld{background:var(--bluebg);color:var(--blue)}.tag.jelmer{background:var(--warnbg);color:var(--warn)}
.tag.flag{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}
.note{padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);margin:6px 0;font-size:13px}
.note.info{background:var(--bluebg);color:var(--blue)}.note.ok{background:var(--accbg);color:var(--acc)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto;z-index:20}
.md{background:var(--card);border-radius:10px;max-width:720px;width:100%;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}.md.wide{max-width:900px}
.md h3{margin:0 0 14px;font-size:17px}
.fg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.fg .c2{grid-column:span 2}.fg .c3{grid-column:span 3}.fg .c4{grid-column:span 4}.fg .c6{grid-column:span 6}
label.f span{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.acts .l{margin-right:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:40}
details summary{cursor:pointer;color:var(--blue);font-size:12.5px}
.rub td:first-child{width:60px;font-weight:700}.rub tr.tot td{font-weight:700;background:var(--side)}
.regel{display:grid;grid-template-columns:1.2fr 3fr .7fr .9fr .9fr 28px;gap:6px;margin-bottom:6px}
.rv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}.pv{position:sticky;top:0}.pv iframe,.pv img{width:100%;height:78vh;border:1px solid var(--line);border-radius:10px;object-fit:contain;background:#fff}.md.xl{max-width:1320px}
.tag.ok{background:#dff3e4;color:#1d6b35}
h3{font-size:14px;margin:18px 0 6px}
.drop{border:2px dashed var(--line);text-align:center;padding:26px;cursor:pointer;border-radius:12px}.drop.over{border-color:var(--acc);background:var(--accbg)}
/* uren + prijs */
.stat .big{font-size:24px}.pbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin:8px 0}.pbar i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}.leg b{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.quick{display:grid;grid-template-columns:130px 1.3fr 90px 2fr auto;gap:8px;align-items:end;margin:14px 0 6px}
.seg{display:flex;background:var(--hover);border-radius:8px;padding:2px;margin:0 4px 6px}.seg button{flex:1;justify-content:center!important;text-align:center!important;border-radius:6px!important;font-weight:500}.seg button.on{background:var(--card)!important;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}.quick input,.quick select{height:34px}.dag td{background:var(--side);font-size:12px;font-weight:600;color:var(--mut)}
@media(max-width:1000px){.rv{grid-template-columns:1fr}.pv{position:static}}
@media(max-width:800px){.shell{flex-direction:column}aside{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}nav{flex-direction:row;flex-wrap:wrap}nav h6{display:none}main{padding:20px 16px 80px}.quick{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.fg{grid-template-columns:1fr 1fr}.fg>*{grid-column:span 2!important}.regel{grid-template-columns:1fr 1fr}.hide-m{display:none}}
@media print{aside,header,.bar,.noprint,.toast{display:none!important}body{background:#fff}main{padding:0}.card,table{box-shadow:none}}
</style>
</head>
<body>
<div class="shell"><aside><div class="brand"><i>L</i>Lennar Finance</div><nav id="nav"></nav></aside>
<main id="main"></main></div>
<script>
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR=new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'});
const eur=n=>EUR.format(Number(n||0));
const dat=s=>s?s.split('-').reverse().join('-'):'';
const today=()=>new Date().toISOString().slice(0,10);
const SOORT={inkomst:'Inkomst',kosten:'Kosten',prive_uitgave:'Privé-uitgave',storting:'Storting (privé → zakelijk)',btw_betaling:'Btw-betaling',overboeking:'Overboeking ING → Wise',overige_baten:'Overige opbrengst (geen btw, bijv. bankbonus)',btw_teruggave:'Btw-teruggave ontvangen'};
const BTWS={nl21:'NL 21%',nl9:'NL 9%',nl0:'0% / geen btw (omzet)',eu_verlegd:'EU – btw verlegd (4b)',buiten_eu_verlegd:'Buiten EU – btw verlegd (4a)',buitenlandse_btw:'Buitenlandse btw (niet aftrekbaar)',geen:'Geen btw'};
const REK={ing:'Zakelijk (ING)',wise:'Wise-kaart',prive:'Privé betaald (voorgeschoten)'};
const state={page:'dashboard',jaar:new Date().getFullYear(),relaties:[],instellingen:{}};
let cache={};

async function api(m,u,b){
  const r=await fetch('/api/'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){toast(j.fout||'Er ging iets mis');throw new Error(j.fout||r.status)}
  return j;
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function tag(b){
  if(b.soort!=='inkomst'&&b.soort!=='kosten')return '';
  if(b.toewijzing==='gedeeld')return `<span class="tag gedeeld">Gedeeld · ik ${+b.pct_ik}%</span>`;
  if(b.toewijzing==='jelmer')return '<span class="tag jelmer">Jelmer</span>';
  return '<span class="tag ik">Ik</span>';
}
function modal(html,wide,cls){
  const o=document.createElement('div');o.className='ov';
  o.innerHTML=`<div class="md ${wide?'wide':''} ${cls||''}">${html}</div>`;
  const close=()=>{o.remove();document.removeEventListener('keydown',esc_)};
  const esc_=e=>{if(e.key==='Escape')close()};
  o.addEventListener('mousedown',e=>{if(e.target===o)close()});
  document.addEventListener('keydown',esc_);
  document.body.append(o);o.close=close;return o;
}
function val(el,n){const x=el.querySelector(`[name=${n}]`);return x?(x.type==='checkbox'?x.checked:x.value):undefined}
function setv(el,o){for(const [k,v] of Object.entries(o)){const x=el.querySelector(`[name=${k}]`);if(!x)continue;if(x.type==='checkbox')x.checked=!!v;else x.value=v??''}}
const opts=(o,sel)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${k===sel?'selected':''}>${esc(v)}</option>`).join('');
const yearOpts=(sel)=>[2025,2026,2027,2028].map(y=>`<option ${y==sel?'selected':''}>${y}</option>`).join('');
function lastQ(){const d=new Date();let q=Math.floor(d.getMonth()/3)+1,y=d.getFullYear();q--;if(!q){q=4;y--}return{y,q}}

/* ------------------------------------------------ navigatie */
const GROEPEN=[['Werk',[['dashboard','Overzicht'],['uren','Uren'],['facturen','Facturen'],['prijs','Prijscalculator']]],
 ['Boekhouding',[['inbox','Inbox'],['bank','Bank afstemmen'],['boekingen','Boekingen'],['btw','Btw-aangifte'],['verrekening','Verrekening Jelmer']]],
 ['Beheer',[['abonnementen','Abonnementen'],['relaties','Klanten & leveranciers'],['instellingen','Instellingen']]]];
const GROEPEN_PRIVE=[['Privé',[['priveov','Overzicht'],['privemut','Mutaties'],['privevast','Vaste lasten'],['priveprog','Prognose'],['privecat','Categoriseren']]],
 ['Beheer',[['instellingen','Instellingen']]]];
const VAST=['dashboard','priveov','instellingen'];
const modus=()=>state.modus||state.instellingen.modus||'zakelijk';
const groepen=()=>modus()==='prive'?GROEPEN_PRIVE:GROEPEN;
function verborgen(){try{return JSON.parse(state.instellingen.nav_verborgen||'[]')}catch(e){return[]}}
async function zetModus(m){state.modus=m;state.instellingen=await api('PUT','instellingen',{modus:m});go(m==='prive'?'priveov':'dashboard')}
function nav(){
  const vb=verborgen(),mo=modus();
  $('#nav').innerHTML=`<div class="seg"><button class="${mo==='zakelijk'?'on':''}" onclick="zetModus('zakelijk')">Zakelijk</button><button class="${mo==='prive'?'on':''}" onclick="zetModus('prive')">Privé</button></div>`+
   groepen().map(([g,l])=>[g,l.filter(([k])=>!vb.includes(k)||k===state.page)]).filter(([,l])=>l.length).map(([g,l])=>`<h6>${g}</h6>`+l.map(([k,t])=>`<button class="${state.page===k?'on':''}" data-p="${k}">${t}${k==='inbox'&&state.inboxN?` <span class="tag flag">${state.inboxN}</span>`:''}</button>`).join('')).join('');
  $$('#nav button[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));
}
async function go(p){if(p==='dashboard'&&modus()==='prive')p='priveov';if(p==='priveov'&&modus()!=='prive')state.modus='prive';state.page=p;nav();$('#main').innerHTML='<p class="mut">Laden…</p>';window.scrollTo(0,0);
  state.relaties=await api('GET','relaties');state.instellingen=await api('GET','instellingen');if(!state.modus){state.modus=state.instellingen.modus||'zakelijk';if(p==='dashboard'&&state.modus==='prive'){p='priveov';state.page=p}nav()}
  const ib=await api('GET','inbox');state.inboxN=ib.bestanden.length+ib.concepten.length;nav();
  await ({dashboard,inbox,bank,boekingen,btw,verrekening,facturen,abonnementen,relaties,instellingen,uren,prijs,priveov,privemut,privevast,priveprog,privecat}[p])();}


/* ------------------------------------------------ bank afstemmen */
async function bank(){
  $('#main').innerHTML=`<div class="bar"><h1>Bank afstemmen</h1></div>
  <div class="drop" id="bz"><b>Sleep je bankafschriften (csv) hierheen</b> <span class="mut">of klik om te kiezen</span>
   <div class="k" style="margin-top:6px">ING: Mijn ING → Zakelijk → Af- en bijschrijvingen → downloaden als csv. Wise: Rekeningafschriften → csv (EUR). Je kunt meerdere bestanden tegelijk kiezen. Er wordt niets automatisch geboekt; jij beslist per regel.</div>
   <input type="file" id="bf" multiple accept=".csv" hidden></div><div id="bres"></div>`;
  const dz=$('#bz'),fi=$('#bf');
  dz.onclick=()=>fi.click();
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');bankLees(e.dataTransfer.files)};
  fi.onchange=()=>bankLees(fi.files);
}
async function bankLees(files){
  const bestanden=[];
  for(const f of files)bestanden.push({naam:f.name,tekst:await f.text()});
  $('#bres').innerHTML='<p class="mut">Afstemmen…</p>';
  try{state.bank=await api('POST','bank/analyse',{bestanden});}catch(e){$('#bres').innerHTML='';return}
  bankToon();
}
function bankToon(){
  const r=state.bank,NAAM={ing:'ING zakelijk',wise:'Wise-kaart'};let h=r.waarschuwingen.length?`<div class="note info">${r.waarschuwingen.map(esc).join('<br>')}</div>`:'';
  for(const [k,a] of Object.entries(r.rekeningen)){
    const klopt=Math.abs(a.saldo_verschil)<0.01;
    h+=`<h2>${NAAM[k]}</h2><div class="card"><div class="row"><span class="k">Periode in het bestand</span><span>${dat(a.van)} t/m ${dat(a.tot)} · ${a.aantal} regels</span></div>
     <div class="row"><span class="k">Saldo volgens bank (${dat(a.saldo_datum)})</span><b>${eur(a.saldo_bank)}</b></div>
     <div class="row"><span class="k">Saldo volgens administratie</span><span>${eur(a.saldo_app)}</span></div>
     <div class="row"><span class="k">Verschil</span>${klopt?'<span class="tag ok">klopt</span>':`<b class="neg">${eur(a.saldo_verschil)}</b>`}</div>
     <div class="row"><span class="k">Gekoppeld aan boekingen</span><span>${a.gekoppeld} regels${a.terugboekingen?` · ${a.terugboekingen} regels die elkaar opheffen (terugboeking)`:''}</span></div>
     ${k==='ing'?`<div style="margin-top:8px"><button class="b sec" onclick="bankSaldo(${a.saldo_bank},'${a.saldo_datum}')">Dit bedrag bewaren als werkelijk ING-saldo</button></div>`:''}</div>`;
    if(a.nieuw.length)h+=`<h3>Regels die nog niet in de administratie staan (${a.nieuw.length})</h3><table><thead><tr><th>Datum</th><th>Partij / omschrijving</th><th class="num">Bedrag</th><th></th></tr></thead><tbody>${a.nieuw.map((x,i)=>`<tr><td>${dat(x.datum)}</td><td>${esc(x.tegenpartij)}<div class="k">${esc((x.omschrijving||'').slice(0,110))}</div></td><td class="num">${eur(x.bedrag)}</td><td class="num"><button class="b sec" onclick="bankConcept('${k}',${i},'nieuw')">Maak concept</button></td></tr>`).join('')}</tbody></table><div class="k">Een concept komt in de Inbox; daar vul je soort, btw en bijlage in en keur je het goed.</div>`;
    if(a.zakelijk_onbekend&&a.zakelijk_onbekend.length)h+=`<h3>Lijkt zakelijk, maar niet gevonden (${a.zakelijk_onbekend.length})</h3><table><tbody>${a.zakelijk_onbekend.map((x,i)=>`<tr><td>${dat(x.datum)}</td><td>${esc(x.tegenpartij)}</td><td class="num">${eur(x.bedrag)}</td><td class="num"><button class="b sec" onclick="bankConcept('${k}',${i},'zakelijk_onbekend')">Maak concept</button></td></tr>`).join('')}</tbody></table>`;
    if(a.prive_maanden&&a.prive_maanden.length)h+=`<h3>Privé-uitgaven met de Wise-kaart per maand</h3><table><thead><tr><th>Maand</th><th class="num">Volgens bank</th><th class="num">In administratie</th><th class="num">Verschil</th><th></th></tr></thead><tbody>${a.prive_maanden.map((m,i)=>`<tr><td>${m.maand}</td><td class="num">${eur(m.bank)}</td><td class="num">${eur(m.administratie)}</td><td class="num">${Math.abs(m.verschil)<0.01?'<span class="tag ok">klopt</span>':`<b class="neg">${eur(m.verschil)}</b>`}</td><td class="num">${Math.abs(m.verschil)<0.01?'':`<button class="b sec" onclick="bankPrive(${i})">Verschil boeken als privé</button>`}</td></tr>`).join('')}</tbody></table><div class="k">Alles op de Wise-kaart wat niet bij een zakelijke boeking hoort, telt als privé.</div>`;
    if(a.ontbreekt.length)h+=`<h3>In de administratie, maar niet op het afschrift (${a.ontbreekt.length})</h3><table><tbody>${a.ontbreekt.map(x=>`<tr class="klik" onclick="editBoeking(${x.id})"><td>${dat(x.datum)}</td><td>${esc(x.omschrijving)}</td><td class="num">${eur(x.bedrag)}</td></tr>`).join('')}</tbody></table><div class="k">Controleer datum, bedrag of rekening van deze boekingen.</div>`;
  }
  $('#bres').innerHTML=h||'<p class="mut">Geen bruikbare regels gevonden.</p>';
}
async function bankConcept(k,i,lijst){const x=state.bank.rekeningen[k][lijst][i];
  const b=await api('POST','bank/concept',{rekening:k,datum:x.datum,bedrag:x.bedrag,tegenpartij:x.tegenpartij,omschrijving:x.omschrijving});
  toast('Concept gemaakt – open het in de Inbox');state.bank.rekeningen[k][lijst].splice(i,1);bankToon();}
async function bankPrive(i){const m=state.bank.rekeningen.wise.prive_maanden[i];
  await api('POST','bank/prive',{maand:m.maand,datum:m.datum,bedrag:m.verschil});toast('Verschil geboekt');m.administratie=m.bank;m.verschil=0;bankToon();}
async function bankSaldo(s,d){await api('POST','bank/saldo',{saldo:s,datum:d});toast('Werkelijk ING-saldo bewaard');}

/* ------------------------------------------------ dashboard */
async function dashboard(){
  const d=await api('GET','dashboard?jaar='+state.jaar);
  const kwk=d.kwartalen.map(k=>`<div class="card"><div class="row"><b>Q${k.kwartaal} ${d.jaar}</b><span class="k">aangifte vóór ${dat(k.deadline)}</span></div>
   <div class="row"><span class="k">Omzet (ex. btw)</span><span>${eur(k.omzet)}</span></div>
   <div class="row"><span class="k">Kosten (mijn deel)</span><span>${eur(k.kosten)}</span></div>
   <div class="row"><span class="k">Winst voor belasting</span><b class="${k.winst<0?'neg':''}">${eur(k.winst)}</b></div>
   <div class="row" style="border-top:1px solid var(--line);margin-top:6px;padding-top:8px"><span class="k">Btw ${k.btw_saldo>=0?'af te dragen':'terug te vragen'}</span><b>${eur(Math.abs(k.btw_saldo))}</b></div>
   <div style="margin-top:6px"><button class="lnk" onclick="gaBtw(${d.jaar},${k.kwartaal})">Open btw-aangifte →</button></div></div>`).join('');
  const tot=d.kwartalen.reduce((a,k)=>({o:a.o+k.omzet,k:a.k+k.kosten}),{o:0,k:0});

   <label class="f c3 vwie" id="pctw"><span>Mijn aandeel (%)</span><input type="number" step="1" min="0" max="100" name="pct_ik"></label>

  <div class="acts">${nieuw?'':'<button class="b red l" id="del">Verwijderen</button>'}<button class="b sec" id="cn">Annuleren</button>${isC?'<button class="b sec" id="okc">Opslaan als concept</button><button class="b" id="ok">Goedkeuren</button>':'<button class="b" id="ok">Opslaan</button>'}</div>`),!!pv,pv?'xl':'');
  const f=$('#bf',m);

function csvBtw(){const d=window._btw;const rows=[['Rubriek','Omschrijving','Grondslag','Btw']];d.rubrieken.forEach(r=>rows.push([r.rubriek,r.omschrijving,r.grondslag,r.btw]));rows.push(['5a','Verschuldigde btw','',d.verschuldigd_5a],['5g','Saldo (positief = betalen)','',d.saldo_5g]);

function pmBereken(m){
  const cap=m.weken*m.uren_week,dec=cap*m.declarabel/100;
  const delen=[['Salaris (bruto)',m.salaris,'#2383e2'],['Vakantiegeld',m.salaris*m.vakantie/100,'#529cca'],['Pensioen & premies (werkgeversdeel)',m.salaris*m.lasten/100,'#0f7b6c'],['Bedrijfskosten',m.kosten*12,'#cb912f'],['Reserveringen (AOV, ziekte, buffer)',m.reserve*12,'#9b9a97']];
  const sub=delen.reduce((a,d)=>a+d[1],0);
  delen.push(['Ondernemersrisico',sub*m.risico/100,'#e03e3e']);
  const tot=sub*(1+m.risico/100);
  return {cap,dec,delen:delen.map(([n,v,c])=>({n,c,jaar:v,uur:dec?v/dec:0})),tot,tarief:dec?tot/dec:0,

async function prijs(){
  const m=pmLaad();

  <p class="k" style="margin-top:-8px">Wat moet je per uur vragen om minstens hetzelfde over te houden als in loondienst? Je kunt rekenen in de vakken (bijv. 48000/12). Wijzigingen worden automatisch bewaard.</p>
  <div class="rv" style="grid-template-columns:minmax(0,340px) minmax(0,1fr)"><div class="card" id="pin">${PM_VELDEN.map(([t,l])=>`<h3 style="margin-top:0">${t}</h3>${l.map(([k,n,e])=>`<label class="f" style="display:block;margin-bottom:8px"><span>${n} <b>(${e})</b></span><input type="number" step="any" name="${k}"></label>`).join('')}`).join('')}</div><div id="pout"></div></div>`;

   <div class="card stat"><div class="k">Declarabele uren per jaar</div><div class="big">${Math.round(r.dec)}</div><div class="k">van ${Math.round(r.cap)} beschikbare uren</div></div></div>

   <div class="pbar">${pct}</div>
   <table><thead><tr><th>Onderdeel</th><th class="num">Per jaar</th><th class="num">Per maand</th><th class="num">Per uur</th><th class="num">Aandeel</th></tr></thead><tbody>
   ${r.delen.map(d=>`<tr><td><b class="dot" style="background:${d.c}"></b>${d.n}</td><td class="num">${eur(d.jaar)}</td><td class="num">${eur(d.jaar/12)}</td><td class="num">${eur(d.uur)}</td><td class="num">${r.tot?Math.round(d.jaar/r.tot*100):0}%</td></tr>`).join('')}
   <tr class="tot"><td><b>Totaal (break-even)</b></td><td class="num"><b>${eur(r.tot)}</b></td><td class="num"><b>${eur(r.tot/12)}</b></td><td class="num"><b>${eur(r.tarief)}</b></td><td class="num">100%</td></tr></tbody></table></div>

    <div class="row"><span class="k">Nodig om gelijk te zijn aan loondienst</span><span>${eur(r.tot)}</span></div>
    <div class="row"><span class="k">Verschil per jaar</span><b class="${omzetJaar>=r.tot?'pos':'neg'}">${eur(omzetJaar-r.tot)}</b></div>
    <div class="row"><span class="k">Tarief t.o.v. break-even</span><b class="${kleur(m.tarief)}">${r.tarief?Math.round((m.tarief/r.tarief-1)*100):0}%</b></div></div>
   <div class="card"><h3 style="margin-top:0">Vast bedrag ${eur(m.vast)} / maand</h3>
    <div class="row"><span class="k">Effectief uurtarief bij ${m.vast_uren} uur</span><b class="${kleur(vastUur)}">${eur(vastUur)}</b></div>
    <div class="row"><span class="k">Minimaal vast bedrag bij ${m.vast_uren} uur</span><span>${eur(m.vast_uren*r.tarief)}</span></div>
    <div class="row"><span class="k">Gelijk aan uurtarief ${eur(m.tarief)} bij</span><span>${m.tarief?(m.vast/m.tarief).toFixed(1):0} uur</span></div>

const MND=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];

// Alles wat privé is: eigen mutaties + de samengevatte privé-uitgaven met de Wise-kaart uit de zakelijke boekingen
async function priveData(jaar){
  const [mut,bk,vast]=await Promise.all([api('GET',`prive/mutaties?van=${jaar}-01-01&tot=${jaar}-12-31`),api('GET','boekingen?jaar='+jaar),api('GET','prive/vast')]);
  const wise=bk.filter(b=>b.soort==='prive_uitgave'&&b.status!=='concept').map(b=>({id:'b'+b.id,datum:b.datum,soort:'uitgave',bedrag:b.bedrag_excl+b.btw_bedrag,categorie:'Wise-kaart (samengevat)',omschrijving:b.omschrijving,bron:'wise'}));
  return {mut:mut.filter(m=>!m.intern).map(m=>({...m,bron:'prive'})),intern:mut.filter(m=>m.intern),wise,vast};
}

async function privemut(){
  state.pmaand=state.pmaand||today().slice(0,7);
  const mnd=state.pmaand,[y,mo]=mnd.split('-').map(Number);
  const van=mnd+'-01',tot=mnd+'-'+String(new Date(y,mo,0).getDate()).padStart(2,'0');
  const [alleMut,bk]=await Promise.all([api('GET',`prive/mutaties?van=${van}&tot=${tot}`),api('GET','boekingen?jaar='+y)]);

function ppToon(m,vastU,vastI){
  const inkM=(m.opname*(1+m.schommel/100)+vastI),uitM=vastU+m.variabel+m.extra_uit,nettoM=inkM-uitM;
  let s=m.start;const rij=[];const nu=new Date();
  for(let i=0;i<m.maanden;i++){s+=nettoM;const dd=new Date(nu.getFullYear(),nu.getMonth()+i+1,1);rij.push({n:dd.toLocaleDateString('nl-NL',{month:'short',year:'2-digit'}),saldo:s})}
  const lo=Math.min(m.start,...rij.map(r=>r.saldo)),hi=Math.max(m.start,...rij.map(r=>r.saldo)),span=(hi-lo)||1;
  const W=560,H=140,x=i=>20+i*(W-40)/Math.max(1,rij.length-1),y=v=>H-14-(v-lo)/span*(H-34);
  const nul=lo<0&&hi>0?`<line x1="20" x2="${W-20}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-dasharray="4"/>`:'';
  const pts=rij.map((r,i)=>`${x(i)},${y(r.saldo)}`).join(' ');
  const maandenBuffer=uitM>0?m.start/uitM:0,neg=rij.find(r=>r.saldo<0);
  $('#ppout').innerHTML=`<div class="grid g4" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
   <div class="card stat"><div class="k">Inkomen per maand</div><div class="big pos">${eur(inkM)}</div></div>
   <div class="card stat"><div class="k">Uitgaven per maand</div><div class="big">${eur(uitM)}</div></div>
   <div class="card stat"><div class="k">Houdt over per maand</div><div class="big ${nettoM<0?'neg':'pos'}">${eur(nettoM)}</div></div>
   <div class="card stat"><div class="k">Buffer nu</div><div class="big">${maandenBuffer.toFixed(1).replace('.',',')} mnd</div><div class="k">van je uitgaven</div></div></div>
  ${neg?`<div class="note" style="margin-top:14px">Bij deze aannames komt je privé-saldo onder nul in ${esc(neg.n)}.</div>`:`<div class="note ok" style="margin-top:14px">Je saldo blijft positief de komende ${m.maanden} maanden.</div>`}
  <h2>Saldo-verloop</h2><div class="card"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${nul}<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${rij.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.saldo)}" r="3" fill="${r.saldo<0?'var(--bad)':'var(--blue)'}"/>`).join('')}
   ${rij.filter((_,i)=>i%Math.ceil(rij.length/8)===0||i===rij.length-1).map(r=>`<text x="${x(rij.indexOf(r))}" y="${H-1}" font-size="10" text-anchor="middle" fill="var(--mut)">${r.n}</text>`).join('')}</svg></div>
  <table style="margin-top:14px"><thead><tr><th>Maand</th><th class="num">Inkomen</th><th class="num">Uitgaven</th><th class="num">Saldo einde maand</th></tr></thead><tbody>${rij.map(r=>`<tr><td>${r.n}</td><td class="num">${eur(inkM)}</td><td class="num">${eur(uitM)}</td><td class="num ${r.saldo<0?'neg':''}"><b>${eur(r.saldo)}</b></td></tr>`).join('')}</tbody></table>`;
}

// Rekenen in getalvelden: typ bijv. 7,64+5,12+94,21 en druk op Enter of ga naar een ander veld.
const REKEN=/[+\-*\/()]/;
function rekenUit(t){
  let s=t.replace(/\s/g,'').replace('€','');
  if(s.includes(','))s=s.replace(/\./g,'').replace(/,/g,'.');
  if(!s||!/^[0-9.+\-*\/()]+$/.test(s)||!/[0-9]/.test(s))return null;
  try{const r=Function('"use strict";return ('+s+')')();return Number.isFinite(r)?Math.round(r*1e6)/1e6:null}catch(e){return null}
}
function rekenVeld(el){
  const t=el.value;if(!/[+*\/(),]|.-/.test(t.trim()))return false;
  const r=rekenUit(t);if(r===null)return false;
  el.value=String(r);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));return true;
}
function maakRekenbaar(root){
  (root.querySelectorAll?root.querySelectorAll('input[type=number]'):[]).forEach(i=>{i.type='text';i.inputMode='decimal';i.autocomplete='off'});
}
document.addEventListener('input',e=>{const t=e.target;if(t.inputMode==='decimal'&&REKEN.test(t.value.replace(/^\s*-/,'')))e.stopImmediatePropagation()},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.inputMode==='decimal'&&rekenVeld(e.target))e.preventDefault()},true);
document.addEventListener('focusout',e=>{if(e.target.inputMode==='decimal')rekenVeld(e.target)},true);
new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1){if(n.matches('input[type=number]'))maakRekenbaar({querySelectorAll:()=>[n]});maakRekenbaar(n)}}))).observe(document.body,{childList:true,subtree:true});
maakRekenbaar(document);
